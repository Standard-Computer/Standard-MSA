# Woodpecker: Secret scan (gitleaks) — SHA-2955.
#
# Mirrors the secret-scan job in .github/workflows/ci.yml: same pinned
# gitleaks version, same checksum, same flags. The version and checksum are
# stated twice (here and ci.yml) — when bumping gitleaks, bump both.
#
# The node image is reused for this step because it is the one image the
# farm already caches and its base ships curl; pulling a dedicated gitleaks
# image would add a second supply chain for the same binary.
#
# --redact=100: this is a public repo; a scanner that echoes what it found
# has turned one leak into two.
#
# Informational until cutover; see .woodpecker/ci.yml.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: gitleaks
    image: node@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
    environment:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    commands:
      - curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$${GITLEAKS_VERSION}/gitleaks_$${GITLEAKS_VERSION}_linux_x64.tar.gz"
      - echo "$${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
      - tar xzf gitleaks.tar.gz gitleaks
      - ./gitleaks version
      - ./gitleaks dir . --redact=100 --exit-code 2 --report-format json --report-path gitleaks-report.json
      - rm -f gitleaks gitleaks.tar.gz gitleaks-report.json
