# One `docker compose up` gives a working Standard-MSA instance.
# SQLite is the default datastore (local file, zero external services);
# the ./data volume holds the database across restarts.
services:
  app:
    build: .
    environment:
      DATABASE_URL: file:/app/data/standard-msa.db
      APP_BASE_URL: http://localhost:3000
      # Operator sign-in (SHA-3047). Required, and deliberately unset here:
      # compose refuses to start rather than bring up an instance whose
      # operator screens are closed to their own owner. Export it, or put
      # OPERATOR_PASSWORD=... in a .env file next to this one.
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?set OPERATOR_PASSWORD to a long random value (12+ chars) before starting}
    volumes:
      - msa-data:/app/data
    ports:
      - "3000:3000"

volumes:
  msa-data:
